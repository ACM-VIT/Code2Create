packages:
  - "."
  - "apps/*"
  - "packages/*"
# Corepack owns the exact version pinned in package.json. Nested workspace scripts may resolve the
# host pnpm binary, so they must not try to self-switch through pnpm's separate package-manager store.
pmOnFail: ignore
allowBuilds:
  "@firebase/util": false
  "@google/genai": false
  "@posthog/cli": true
  core-js: false
  core-js-pure: false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
  workerd: true
overrides:
  "@babel/core": 7.29.7
  "@hono/node-server": 2.1.5
  "@modelcontextprotocol/client": 2.4.0
  "@modelcontextprotocol/sdk": 1.32.2
  "@modelcontextprotocol/server": 2.4.0
  "@react-native/metro-config": 0.86.3
  body-parser: 2.4.0
  "brace-expansion@5": 5.0.12
  compression: 1.8.2
  decode-uri-component: 0.5.1
  esbuild: 0.28.1
  fast-uri: 3.1.9
  ip-address: 10.7.5
  joi: 17.13.9
  nanoid: 3.3.18
  next: 16.2.11
  node-forge: 1.4.2
  "plist>@xmldom/xmldom": 0.9.12
  postcss: 8.5.25
  proxy-addr: 2.0.8
  qs: 6.17.1
  react-native: 0.86.3
  react-server-dom-webpack: 19.2.8
  sharp: 0.35.5
  shell-quote: 1.12.0
  source-map-js: 1.2.2
  undici: 7.30.1
  uuid: 11.1.1
  "zod@4": 4.6.7
# Reviewed advisories with no installable fix. Revisit whenever a listed package can be upgraded.
auditConfig:
  ignoreGhsas:
    # better-auth: fixed only in 1.7.7, but @convex-dev/better-auth requires <1.7.0. Each needs a
    # plugin this app does not enable (Magic Link, OAuth Proxy, device authorization) or a database
    # adapter it does not use (Drizzle, Kysely).
    - GHSA-965c-763c-88jm
    - GHSA-r4xp-prcw-77qf
    - GHSA-q84f-53jg-9ppm
    - GHSA-44jh-23m7-hpcf
    # Pulled in only by the Expo SDK 57 CLI at build time, with no patched release on these majors.
    # zod 3: unbounded array issues; glob/minimatch: attacker-supplied patterns; deepmerge: no fix.
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249
    - GHSA-gcqx-w48m-w2h4
packageExtensions:
  "posthog-react-native@4.67.0":
    dependencies:
      "@expo/config-plugins": 57.0.9
      metro: 0.84.5
minimumReleaseAgeExclude:
  - miniflare@5.20260828.0-alpha
  - wrangler@4.127.1
  - "@cloudflare/workerd-darwin-64@1.20260828.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260828.1"
  - "@cloudflare/workerd-linux-64@1.20260828.1"
  - "@cloudflare/workerd-linux-arm64@1.20260828.1"
  - "@cloudflare/workerd-windows-64@1.20260828.1"
  - workerd@1.20260828.1
  - "@expo/env@2.4.3"
  - "@cloudflare/workers-types@5.20260828.1"
  - "@ai-sdk/gateway@4.0.71"
  - "@ai-sdk/openai@4.0.55"
  - "@ai-sdk/provider-utils@5.0.35"
  - "@ai-sdk/provider@4.0.10"
  - ai@7.0.89
  - '@kitlangton/rolling-number@0.3.0'
patchedDependencies:
  "@flue/runtime@2.0.3": patches/@flue__runtime@2.0.3.patch
  '@kitlangton/rolling-number@0.3.0': patches/@kitlangton__rolling-number@0.3.0.patch
  balloons-js@0.0.3: patches/balloons-js@0.0.3.patch
  "convex-helpers@0.1.123": patches/convex-helpers@0.1.123.patch
