name: Product checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan changed history for secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          version: 3.96.0
          extra_args: --results=verified,unknown,unverified --fail-on-scan-errors

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true

      - name: Lint and type-check
        run: pnpm check:product

      - name: Test
        run: pnpm test

      - name: Build web applications
        run: pnpm build

      - name: Validate intelligence Worker bindings
        run: pnpm --filter @code2create/intelligence deploy:check

      - name: Validate and export the reviewer app
        run: pnpm --filter @code2create/reviewer config:check && pnpm --filter @code2create/reviewer export:check
        env:
          C2C_NATIVE_BUILD: "true"
          C2C_IOS_BUNDLE_IDENTIFIER: com.code2create.ops.ci
          C2C_ANDROID_PACKAGE: com.code2create.ops.ci
          C2C_UPDATES_URL: https://updates-ci.example.invalid/manifest
          EXPO_PUBLIC_APP_BUILD: "1"
          EXPO_PUBLIC_APNS_ENVIRONMENT: development
          EXPO_PUBLIC_CONVEX_SITE_URL: https://ci-placeholder.convex.site
          EXPO_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
          EXPO_PUBLIC_DEPLOYMENT_ENVIRONMENT: development
          EXPO_PUBLIC_EVENT_SLUG: code2create-7
          EXPO_PUBLIC_RELEASE_ID: ci
