name: Backend production deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true

      - name: Type-check backend
        run: pnpm --filter @code2create/backend typecheck

      - name: Test backend
        run: pnpm --filter @code2create/backend test

  deploy-production:
    name: Deploy production backend
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Allow this runner to read the production vault
        id: vault-network
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          if [[ ! "${runner_ip}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "The runner did not resolve a valid public IPv4 address." >&2
            exit 1
          fi
          az keyvault network-rule add \
            --resource-group rg-code2create-production \
            --name kv-c2c-prod-b88416 \
            --ip-address "${runner_ip}/32" \
            --output none
          echo "runner_ip=${runner_ip}" >>"${GITHUB_OUTPUT}"
          for attempt in {1..12}; do
            if az keyvault secret show \
              --vault-name kv-c2c-prod-b88416 \
              --name convex-admin-key \
              --query id \
              --output tsv >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "The production vault firewall did not admit the runner in time." >&2
          exit 1

      - name: Deploy exact revision to self-hosted Convex
        run: bash infra/azure/production/deploy-convex.sh "${GITHUB_SHA}"

      - name: Remove this runner from the production vault
        if: ${{ always() && steps.vault-network.outputs.runner_ip != '' }}
        env:
          RUNNER_IP: ${{ steps.vault-network.outputs.runner_ip }}
        run: |
          az keyvault network-rule remove \
            --resource-group rg-code2create-production \
            --name kv-c2c-prod-b88416 \
            --ip-address "${RUNNER_IP}/32" \
            --output none
