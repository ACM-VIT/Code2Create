name: Backend production deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true

      - name: Type-check backend
        run: pnpm --filter @code2create/backend typecheck

      - name: Test backend
        run: pnpm --filter @code2create/backend test

  deploy-production:
    name: Deploy production backend
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      C2C_PRODUCTION_ORIGIN_IP: 20.204.40.131
      C2C_PRODUCTION_NSG: nsg-c2c-production-app
      C2C_DEPLOY_NSG_RULE: AllowBackendDeployHttps
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Allow this runner to deploy to the production origin
        id: production-network
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          if [[ ! "${runner_ip}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "The runner did not resolve a valid public IPv4 address." >&2
            exit 1
          fi
          echo "runner_ip=${runner_ip}" >>"${GITHUB_OUTPUT}"
          az keyvault network-rule add \
            --resource-group rg-code2create-production \
            --name kv-c2c-prod-b88416 \
            --ip-address "${runner_ip}/32" \
            --output none
          az network nsg rule create \
            --resource-group rg-code2create-production \
            --nsg-name "${C2C_PRODUCTION_NSG}" \
            --name "${C2C_DEPLOY_NSG_RULE}" \
            --priority 100 \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --source-address-prefixes "${runner_ip}/32" \
            --source-port-ranges '*' \
            --destination-address-prefixes '*' \
            --destination-port-ranges 443 \
            --description "Ephemeral direct origin access for the production backend deployment" \
            --output none
          echo "${C2C_PRODUCTION_ORIGIN_IP} realtime.c2c.sh # code2create-backend-deploy" \
            | sudo tee -a /etc/hosts >/dev/null
          for attempt in {1..12}; do
            if az keyvault secret show \
              --vault-name kv-c2c-prod-b88416 \
              --name convex-admin-key \
              --query id \
              --output tsv >/dev/null 2>&1 \
              && curl --fail --silent --show-error \
                --connect-timeout 5 \
                --max-time 15 \
                https://realtime.c2c.sh/version >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "The production vault or direct backend origin did not admit the runner in time." >&2
          exit 1

      - name: Deploy exact revision to self-hosted Convex
        run: bash infra/azure/production/deploy-convex.sh "${GITHUB_SHA}"

      - name: Remove this runner from the production networks
        if: ${{ always() && steps.production-network.outputs.runner_ip != '' }}
        env:
          RUNNER_IP: ${{ steps.production-network.outputs.runner_ip }}
        run: |
          cleanup_status=0
          sudo sed -i '/# code2create-backend-deploy$/d' /etc/hosts || cleanup_status=1
          if az network nsg rule show \
            --resource-group rg-code2create-production \
            --nsg-name "${C2C_PRODUCTION_NSG}" \
            --name "${C2C_DEPLOY_NSG_RULE}" \
            --output none 2>/dev/null; then
            az network nsg rule delete \
              --resource-group rg-code2create-production \
              --nsg-name "${C2C_PRODUCTION_NSG}" \
              --name "${C2C_DEPLOY_NSG_RULE}" \
              --output none || cleanup_status=1
          fi
          az keyvault network-rule remove \
            --resource-group rg-code2create-production \
            --name kv-c2c-prod-b88416 \
            --ip-address "${RUNNER_IP}/32" \
            --output none || cleanup_status=1
          exit "${cleanup_status}"
